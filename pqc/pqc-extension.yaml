# =====================================================================
# PQC Readiness Extension - Change Log
# ---------------------------------------------------------------------
# 0.6.0  - Added relevance and overlays for the Cryptography category
#            introduced in model 2.0.0 (six requirements): authority
#            positions carried by primary-source references,
#            decision-status approval criteria, measurable inventory
#            coverage, and protocol and terminology criteria in the
#            ladder. References: nist-ir-8545, nist-sp-800-208,
#            nsa-cnsa-2-0, nist-pqc-standardization, and anssi-pqc-faq
#            added; nist-cswp-39 updated to the 29 June 2026 upd1.
#            No changes to previously published category content.
# 0.5.1  - Each Governance category now lists its supporting references,
#            so they display in the assessment application. The category
#            reference lists were previously empty, which is why no
#            references appeared in the tool. Added a note on COM(2026) 13
#            as a forthcoming obligation to the Compliance guidance
#            (tracker item 11, content side). Documentation URL updated
#            to the current pkic.org extensions path. No weights,
#            identifiers, or structural elements changed.
# 0.5.0  - Added 10 regulatory/standards references to the references
#            block (US Quantum Prep Act, CSWP 48 draft, CISA product
#            categories, CSWP 39 final, FIPS 140-2 sunset, NIS2
#            amendment proposal, and APAC: CRYPTREC, KCMVP, Singapore
#            CSA, Australian ISM). Sources: R6, R8, R15.
#            Draft/advisory/proposal status noted per entry to prevent
#            overclaim. UK NCSC timelines not re-added (already present
#            as uk-ncsc-pqc-migration).
# 0.4.0  - Persona broadening in Governance (community feedback).
#          G.strategy-and-vision: added software-vendor / product-team
#            examples to guidance and Levels 3-5. (Source: R8)
#          G.policies-and-documentation: added certificate-consumer
#            framing to guidance and Level 3. (Source: R7)
# 0.3.0  - Expanded segregation-of-duties content in
#            G.processes-and-procedures: guidance, Levels 1, 3, 4.
#            (Source: R6, Policy Management Authority Chair)
# 0.2.0  - Governance relevance + 18 overlays; community RFC baseline.
# =====================================================================
