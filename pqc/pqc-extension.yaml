  # PROVISIONAL pending the extension-wide relevance-weight rule (see change log).
  - id: M
    categories:
    - id: key-management
      weight: 5
      guidance: |
        Key management is where the operational reality of post-quantum cryptography first becomes concrete. The transition introduces new key types with different semantics, new key formats whose handling is not yet uniform across implementations, hardware-module dependencies that frequently gate the entire migration, and at least one signing scheme whose state management can fail catastrophically if mishandled. None of these are matters of policy; all are matters of whether the organization can generate, protect, recover, and retire post-quantum key material under auditable control.
        Two clarifications bound the category. First, cipher-suite governance, the question of which algorithms are approved, is not assessed here; it has moved to the Governance Cryptography category. Key Management consumes that decision and is assessed on whether it can operate the approved material. Second, this category does not evaluate the cryptographic correctness of key-generation implementations. It evaluates whether the program has obtained and operationally accepted credible evidence of that correctness, in keeping with the boundary of assurance.

        Operational hazards specific to PQC:
          - Key-encapsulation mechanisms are not signature schemes. ML-KEM introduces decapsulation behavior, the distinction between static and ephemeral key use, and implementation-misuse risks that differ from RSA or elliptic-curve key establishment. SP 800-227, final since September 2025, provides the current recommendations for implementing and using such mechanisms, and a mature program follows it rather than treating a KEM as a generic new key type.
          - Post-quantum private keys have more than one valid representation. For ML-KEM and ML-DSA, the NIST guidance current as of June 2026 confirms that a key-generation seed is an acceptable alternative format for a key pair or private key, and that a seed generated in one cryptographic module may be imported into or exported from another. This creates a genuine management concern around seed handling, metadata, protection equivalence between seed and expanded forms, and consistency checking. It is a concrete operational matter, not a question of entropy supply.
          - Hardware-module capability is rarely uniform. A statement that a module supports post-quantum algorithms is not assessable; what matters is the firmware version, the specific mechanisms and parameter sets supported, the validation or vendor-affirmation status, the behavior of backup, restore, and clustering, the available interfaces, and the throughput observed under representative signing or issuance load. The dominant cost in post-quantum key generation and signing is compute and interface latency under load, not randomness supply, and capacity evidence should be sought in those terms.
          - Stateful hash-based signatures are a high-severity hazard for the programs that use them. Under SP 800-208, the key-generation and signing operations of LMS and XMSS must be performed within hardware cryptographic modules validated to FIPS 140-2 or FIPS 140-3 Level 3 or higher physical security, private keying material must not be exportable, and the signing state must be advanced in non-volatile storage before a signature is released; reuse of a one-time key, for example through a counter reset or an uncoordinated restore, is catastrophic and unrecoverable. Because NIST states that these schemes are not intended for general use, the criteria addressing this hazard apply only where firmware, secure-boot, product, or other long-lived signing places LMS or XMSS in scope; applicability is determined at the scoping stage.
      assessment: |
        Key Probes:
          - Can the program produce a key-generation record showing post-quantum key material generated within an approved module, under ceremony control, with correct algorithm and parameter metadata?
          - Does the key inventory record, for each managed key, its algorithm family, parameter set, security category, intended use, module location, format, exportability, backup posture, owning service, and migration state?
          - Where key-encapsulation mechanisms are used, does the program follow the implementation and use recommendations of SP 800-227, including the handling of static and ephemeral keys?
          - Where post-quantum keys are stored or exchanged as seeds, how are seed provenance, protection equivalence, and seed-to-expanded-key consistency managed?
          - For each post-quantum-relevant module, what is the firmware version, supported mechanism set, validation status, and measured throughput under representative load?
          - Where stateful hash-based signing is in scope, how is signing state persisted, protected against reuse across failover and restore, and monitored for one-time-key exhaustion?

        Warning Signs:
          - A key inventory that records key existence but not algorithm, parameter set, use, and migration state. Such an inventory cannot drive a migration.
          - An assertion that the hardware module supports post-quantum algorithms, with no firmware version, mechanism list, validation status, or load evidence behind it.
          - Acceptance of post-quantum seed-format keys without a defined position on protection equivalence and consistency checking.
          - Any reliance on stateful hash-based signing without demonstrated single-writer state control and recovery design.
          - Framing key-generation capacity as an entropy problem, which misdescribes the actual compute-and-latency constraint.

        Scope check for stateful hash-based signing: before the related clauses are set aside, check firmware, secure-boot, product, and code-signing pipelines, continuous-integration signing services, the hardware-module key inventory, and release-engineering and timestamping workflows. A conditional clause may be set aside only where the applicability matrix records the basis; the clause is then not treated as unmet. Where scope is unresolved, the clauses are assessed as applicable.
      references:
      - nist-fips-203
      - nist-fips-204
      - nist-fips-205
      - nist-sp-800-227
      - nist-sp-800-208
      - nist-pqc-faqs
      - nist-cswp-39
      levels:
      - number: 1
        name: Initial
        description: |
          - Key management does not distinguish post-quantum key material; inventory, if it exists, records keys without algorithm, parameter set, or use.
          - No assessment of whether hardware modules support the approved post-quantum algorithms.
          - Key-encapsulation mechanisms, where used, are treated as generic new key types without reference to current implementation guidance.
          - Where stateful hash-based signing is in scope, signing state is managed without explicit reuse protection.
      - number: 2
        name: Foundational
        description: |
          - Awareness that post-quantum key material requires inventory and module-capability assessment, without that work completed.
          - Hardware-module post-quantum support is being investigated informally through vendor material rather than tested.
          - The implications of key-encapsulation mechanisms and of post-quantum seed key formats are recognized but not yet reflected in procedures.
          - Stateful hash-based signing, where in scope, is recognized as a special hazard but its state controls are not yet defined.
      - number: 3
        name: Advanced
        description: |
          - A key inventory records, for each managed key, algorithm family, parameter set, security category, use, module location, format, exportability, backup posture, owning service, and migration state. This inventory is the basis of, and is reconciled with, the cryptographic discovery effort.
          - Key-generation procedures for post-quantum algorithms are documented, including module selection, ceremony controls, metadata capture, and the handling of seed and expanded key formats with a defined position on consistency checking.
          - Where key-encapsulation mechanisms or KEM certificates are in scope, the program has a defined position on the role of each KEM key as static, semi-static, or ephemeral, on decapsulation-key lifetime, rotation, and protection, and on how possession or control of the decapsulation key is evidenced during enrollment or issuance, consistent with SP 800-227. The module assesses that such a position exists and is applied, not the protocol design itself.
          - For each post-quantum-relevant module, firmware version, supported mechanisms, and validation or vendor-affirmation status are recorded, and a position on residual risk is documented in keeping with the boundary of assurance.
          - Where stateful hash-based signing is in scope, state persistence, single-writer enforcement, non-exportable hardware handling, recovery design, and one-time-key exhaustion monitoring are documented per SP 800-208.
      - number: 4
        name: Managed
        description: |
          - Post-quantum key generation has been performed and evidenced: ceremony records show approved-module generation with correct metadata, and seed handling, where used, has been exercised including a consistency check on import.
          - Module post-quantum capability has been confirmed by test, not by assertion, including measured throughput under representative signing or issuance load and observed backup, restore, and clustering behavior.
          - The key inventory is maintained against change and reconciled periodically with discovery output; migration state is current.
          - Where stateful hash-based signing is in scope, state control has been demonstrated across a failover and a restore without one-time-key reuse, with the test retained as evidence.
      - number: 5
        name: Optimized
        description: |
          - Post-quantum key lifecycle is operated as routine controlled practice: generation, protection, rotation, and retirement are evidenced, and module capability and load headroom are monitored rather than assumed.
          - Seed and expanded key formats are handled under a settled policy with automated consistency enforcement where keys are imported.
          - The key inventory is continuously reconciled with discovery and migration tracking, and supports reporting on migration progress by algorithm and security category.
          - Where stateful hash-based signing is in scope, state control is continuously monitored with exhaustion thresholds and tested recovery; it is deliberately not fully automated, because safe state management depends on controlled, audited operation.
    - id: certificate-management
      weight: 5
      guidance: |
        Issuing a post-quantum or hybrid certificate is the straightforward part of certificate management. The difficulty, and the place where transitions most often fail in production, lies outside the certificate authority: in whether relying parties can build and validate the new chains, whether enrollment protocols accept the larger and structurally different objects, whether revocation infrastructure scales to post-quantum signature sizes, and whether trust anchors and intermediates can be rolled over without breaking the population that depends on them. This category therefore extends beyond issuance to the validation ecosystem on which issuance depends.
        The extension of scope beyond issuance is the most significant development of this category relative to the original outline, and it is deliberate. A maturity model that assessed only the issuing side would over-credit programs that can mint a post-quantum certificate but cannot operate it, and would miss the relying-party and protocol failures that dominate real migrations.

        Operational hazards specific to PQC:
          - Relying-party validation is the dominant risk and is frequently outside the certificate authority's direct control. Post-quantum and hybrid certificates exercise path building, trust-store handling, unknown-extension behavior, and chain selection in ways that classical certificates do not, and a certificate that issues cleanly may still fail to validate in a material part of the population.
          - Certificate validity can outlast algorithm assurance. Under the transition timeline in NIST IR 8547 (final, October 2026), quantum-vulnerable public-key algorithms such as RSA and elliptic-curve schemes are deprecated after 2030 and disallowed after 2035 under NIST standards. A long-lived certificate issued today with a classical algorithm may cross that timeline before it expires, which makes validity-period policy a post-quantum management concern rather than a routine one.
          - Revocation infrastructure is sensitive to signature size. Where status responses and revocation lists are signed with post-quantum algorithms, response sizes, responder signing throughput, caching, stapling, and client parsing all become operational concerns, and revocation that was unremarkable under classical signatures can degrade under post-quantum ones.
          - Object size affects the wider system. Larger public keys and signatures influence handshake sizes, transport fragmentation, directory storage, constrained devices, and brittle parsers. The certificate category and the infrastructure category share responsibility for this concern, and neither should assume the other has covered it.
          - Enrollment protocols may fail before the issuing engine does. ACME, EST, SCEP, CMP, registration-authority portals, device-management systems, and platform integrations can reject the larger and newer structures, and a program that has tested only its certificate authority has not tested its issuance path.
          - Trust-anchor and intermediate transition is a distinct, high-consequence operation. Root and intermediate rollover for post-quantum, whether by cross-signing or parallel hierarchy, exercises trust-anchor distribution, chain building, and emergency rollback, and a generic lifecycle requirement serves it poorly.

        Long-term validation, including trusted timestamping and archival signature validation under regimes such as eIDAS and ETSI, applies within this category only where the program supports document signing, code signing, regulated trust services, or other long-lived evidence. Where the program issues only short-lived authentication certificates, the affected long-term-validation clauses are treated as outside scope when determining the category's relevance level, with the basis for the exclusion recorded in the applicability matrix. A signature that must remain verifiable for years carries a post-quantum exposure that a short-lived transport certificate does not.
      assessment: |
        Key Probes:
          - Has the program validated that representative relying parties can build and verify post-quantum or hybrid chains, including behavior on unknown extensions and chain selection?
          - Does certificate-validity policy account for the deprecation trajectory of classical algorithms, so that certificate lifetimes do not outlast the assurance of the algorithms that sign them?
          - Have revocation services been tested under post-quantum signature sizes, including response size, responder throughput, and client parsing?
          - Which enrollment protocols and integrations have been confirmed to accept post-quantum and hybrid certificate structures?
          - Has a trust-anchor or intermediate rollover for post-quantum been rehearsed, including distribution, chain building, and rollback?
          - Where certificates bind KEM public keys, what proof-of-possession or decapsulation-control mechanism is used during enrollment, given that a KEM public key cannot by itself serve as the verification key for a certificate-request signature in the way a signing key can?
          - Where long-lived signatures are in scope, is there a tested approach to keeping them verifiable as classical algorithms are deprecated?

        Warning Signs:
          - Evidence of post-quantum issuance with no evidence of relying-party validation. Issuance without validation is not capability.
          - Certificate-validity policy unchanged in light of the algorithm deprecation trajectory.
          - Revocation services assumed to scale to post-quantum signatures without measurement.
          - Enrollment-path readiness inferred from certificate-authority readiness rather than tested.
          - Trust-anchor transition treated as routine lifecycle rather than rehearsed as a high-consequence operation.

        Required evidence for relying-party validation (Levels 4 and 5). Validation is evidenced across the relevant classes on which the service depends: browser and operating-system trust stores; the runtime validators in use, such as Java, .NET, or OpenSSL-derived stacks; mutual-authentication and service-to-service clients; virtual-private-network, load-balancer, and proxy paths; mobile and managed-device populations; embedded or operational-technology endpoints where in scope; and external relying parties where material. Each class tested is recorded with its result, including behavior on unknown extensions and chain selection; each class excluded is justified.

        Scope check for long-term validation: before the related clauses are set aside, check document, regulated, and code signing, timestamping, archival validation, and any long-retention legal or compliance obligation. A conditional clause may be set aside only where the applicability matrix records the basis; the clause is then not treated as unmet. Where scope is unresolved, the clauses are assessed as applicable.
      references:
      - nist-fips-203
      - nist-fips-204
      - nist-fips-205
      - nist-ir-8547
      - nist-sp-800-227
      - nist-sp-1800-38
      levels:
      - number: 1
        name: Initial
        description: |
          - Certificate management addresses issuance only; relying-party validation, enrollment-path readiness, and revocation scaling for post-quantum are not considered.
          - Certificate-validity policy does not reflect the deprecation trajectory of classical algorithms.
          - Trust-anchor and intermediate transition for post-quantum is unconsidered.
      - number: 2
        name: Foundational
        description: |
          - Awareness that post-quantum certificates affect validation, enrollment, and revocation, without that work begun.
          - Recognition that certificate lifetimes interact with algorithm deprecation, without policy change.
          - Hybrid and post-quantum profiles discussed but not issued or validated in a controlled setting.
      - number: 3
        name: Advanced
        description: |
          - Post-quantum and hybrid certificate profiles are defined, including encoding, extensions, and policy identifiers, and the issuing configuration enforces them.
          - Certificate-validity policy accounts for the algorithm deprecation timeline in NIST IR 8547, so that lifetimes do not outlast algorithm assurance.
          - A defined approach exists for relying-party validation testing, for enrollment-protocol readiness across the protocols in use, and for revocation behavior under post-quantum signature sizes.
          - Where certificates bind KEM public keys, enrollment procedures define how possession or operational control of the corresponding decapsulation key is evidenced, since a KEM public key cannot by itself serve as the verification key for a request signature; the program is assessed on having an accepted mechanism, not on designing the protocol.
          - A trust-anchor and intermediate transition approach is documented, including cross-signing or parallel hierarchy, distribution, and rollback.
          - Where long-lived signatures are in scope, an approach to sustained verifiability is documented.
      - number: 4
        name: Managed
        description: |
          - Relying-party validation of post-quantum or hybrid chains has been demonstrated against a representative population, with results, including unknown-extension and chain-selection behavior, retained as evidence.
          - Enrollment paths in use have been confirmed to accept post-quantum structures, and revocation services have been measured under post-quantum signature sizes.
          - A trust-anchor or intermediate rollover has been rehearsed in a representative environment, including rollback.
          - Where long-lived signatures are in scope, sustained verifiability has been demonstrated for at least one representative case.
      - number: 5
        name: Optimized
        description: |
          - Relying-party validation, enrollment-path readiness, and revocation performance for post-quantum are monitored as operational properties rather than confirmed once.
          - Certificate-profile and validity policy is maintained against the evolving deprecation trajectory, and issuance is constrained accordingly.
          - Trust-anchor and intermediate transition is a rehearsed, controlled capability with tested rollback; it is not automated where assurance depends on controlled ceremony.
          - Where long-lived signatures are in scope, sustained verifiability is operated and monitored.
    - id: infrastructure-management
      weight: 4
      guidance: |
        Post-quantum failure often occurs in libraries, appliances, firmware, network paths, and observability before it occurs in the certificate authority. Infrastructure management is where the larger objects and different performance characteristics of post-quantum cryptography meet the systems that must carry them, and where the dependency on vendor firmware and validated modules is most likely to gate the entire migration. The category assesses whether the supporting infrastructure can carry post-quantum cryptography, observe it, and reveal when it silently fails.
        Consistent with the boundary of assurance, this category does not evaluate the internal correctness of cryptographic libraries or appliances. It evaluates whether the program has obtained capability and validation evidence for them, has tested their behavior under representative conditions, and can detect failure and fallback in operation.

        Operational hazards specific to PQC:
          - Component readiness is uneven. Load balancers, transport terminators, virtual private network gateways, hardware-module clients, service meshes, runtimes, cryptographic providers, smartcards, and constrained or operational-technology devices may not support the same post-quantum modes at the same time, and the slowest component sets the pace of migration.
          - Size and performance change measurably, and the effect on the network path is more nuanced than a single byte count suggests. Larger keys and signatures affect latency at the tail, handshake sizes, transport behavior, module queue depth, memory, and timeouts. Post-quantum public keys and signatures are materially larger than common classical equivalents, and the growth compounds: repeated across a certificate chain and combined with hybrid key exchange, handshake data can exceed the common 1,500-byte Ethernet maximum transmission unit by several multiples, and the lower effective limits created by tunnels, virtual private networks, and encapsulation are reached sooner still. The consequence is not automatic fragmentation at intermediate devices. For TLS over TCP, a large handshake is normally segmented at the source host according to the negotiated maximum segment size, and path-MTU discovery adjusts it; the failure modes there are additional round trips, congestion-window throttling during slow start, and tail-latency spikes, not router fragmentation. Where path-MTU discovery is broken because the signalling is filtered, the oversized packet can be silently dropped, producing a path-MTU black hole and a stalled handshake. For datagram transports such as QUIC and DTLS over UDP, large handshakes are fragmented at the protocol or IP layer and are genuinely exposed to packet loss and drops at intermediate devices. The assessable requirement is therefore measurement of packetization, path-MTU behavior, fragmentation, and tail latency across representative paths and transports, not reliance on a single threshold; a capacity assessment that asks for no measurement will read as theoretical.
          - Post-quantum can fail silently into classical operation. Where negotiation, chain selection, or client compatibility is misconfigured, a system may fall back to classical cryptography without alerting, which defeats the purpose of the migration while appearing to succeed. Telemetry showing the negotiated mechanisms and the rate and reason of fallback is therefore an infrastructure requirement, not a refinement.
          - Representative testing is essential and easily faked. A laboratory with one modern client and one test module proves little; evidence at the higher levels should reflect representative clients, legacy endpoints, mobile and embedded systems, proxies, mutual authentication, and degraded network conditions.
          - Much infrastructure is not owned, and for a large share of programs the managed-service case is the primary case rather than an exception. Many programs depend on cloud key-management and module services, managed private certificate authorities, content-delivery transport, and vendor-controlled trust stores, and for these the firmware, clustering, and replication evidence that an owning operator would produce is simply not theirs to produce. The criteria are written to be scored cleanly by such a program: its management maturity is evidenced by the attested post-quantum readiness of the services it consumes, by its own configuration of those services, by its management of the shared-responsibility boundary when an algorithm is deprecated, and by its contractual position, rather than by hardware evidence it does not hold. The criteria deliberately avoid naming particular providers or provider-specific mechanisms, so that they remain scorable and durable across deployment models. Because a managed-service program evidences readiness partly through provider attestation rather than direct control, that reliance is itself recorded as a dependency and a residual risk, so that the trade-off between consuming a service and controlling it is visible in the assessment rather than hidden by it.
          - Hardware-module firmware and lifecycle frequently gate readiness. Whether the vendor has shipped validated firmware, whether the algorithms are supported within the validated boundary, and whether policy can be updated without revalidation collapse are often the determining factors, and they belong in infrastructure as scored criteria rather than as narrative.

        Physical security is not weighted under post-quantum conditions, because its control set does not change in nature during a migration. Where a hardware refresh occurs, the custody of new modules, secure transport, swap windows, and access-logged replacement may be captured as supporting evidence under module migration execution, but this is treated as ordinary change and capacity management, not as a post-quantum maturity overlay.
      assessment: |
        Key Probes:
          - Which infrastructure components in the cryptographic path have been confirmed to support the intended post-quantum modes, and which set the migration pace?
          - Has the program measured the latency, size, fragmentation, and capacity effects of post-quantum objects under representative load?
          - Is there telemetry showing negotiated post-quantum mechanisms and the rate and reason of fallback to classical operation?
          - Where infrastructure is provided by cloud or managed services, what is the evidenced post-quantum readiness and contractual position of those services?
          - For each hardware-module dependency, is validated firmware available, are the algorithms within the validated boundary, and can policy be updated without revalidation collapse?

        Warning Signs:
          - A capacity position asserted without measurement under representative load.
          - No telemetry distinguishing genuine post-quantum operation from silent classical fallback.
          - Test evidence drawn from a single modern client and a single module.
          - An owned-infrastructure assumption in a program that in fact depends on cloud or managed services.
          - Hardware-module readiness asserted from a vendor roadmap rather than validated firmware.

        Required evidence for fallback and downgrade telemetry (Levels 4 and 5). The telemetry records, per connection or transaction class: the negotiated mechanism; the certificate, profile, and chain used; whether a fallback event occurred and its reason; the client or service class involved; the rate and trend of fallback; the exception owner where fallback is expected; and the action taken where it is not. Telemetry that reports success or failure without distinguishing genuine post-quantum operation from silent classical fallback does not satisfy the requirement.
      references:
      - nist-fips-203
      - nist-fips-204
      - nist-sp-800-208
      - nist-sp-1800-38
      - nist-cswp-39
      levels:
      - number: 1
        name: Initial
        description: |
          - Infrastructure post-quantum readiness is unassessed; component support, capacity effects, and fallback behavior are unknown.
          - No telemetry distinguishes post-quantum from classical operation.
          - Dependence on cloud, managed, or vendor-controlled infrastructure for cryptography is not characterized.
      - number: 2
        name: Foundational
        description: |
          - Awareness that post-quantum objects affect components, capacity, and negotiation, without measurement.
          - Hardware-module firmware readiness is being tracked from vendor material rather than tested.
          - The set of infrastructure components in the cryptographic path is being identified.
      - number: 3
        name: Advanced
        description: |
          - The infrastructure components in the cryptographic path are documented, with their post-quantum support status and the components that pace migration identified.
          - A defined approach exists for measuring the latency, size, fragmentation, and capacity effects of post-quantum objects under representative load.
          - Telemetry requirements for negotiated mechanisms and for fallback rate and reason are defined.
          - For each hardware-module dependency, firmware, validated-boundary algorithm support, and revalidation implications are recorded; for cloud or managed dependencies, the readiness and contractual position are documented.
          - Module custody and replacement procedures for any hardware refresh are documented as supporting evidence.
      - number: 4
        name: Managed
        description: |
          - Capacity and performance effects have been measured under representative load, with results retained, covering tail latency, fragmentation, and module throughput. Where infrastructure is consumed as a managed service and direct module measurement is not available to the program, the equivalent evidence is the provider's published capacity and algorithm-support position, the program's monitoring of service quotas and rate-limit behavior, and its shared-responsibility mapping for the deprecation event.
          - Fallback telemetry is in place and has surfaced, or demonstrably would surface, silent reversion to classical operation.
          - Representative testing has covered legacy, mobile, embedded, proxied, mutually authenticated, and degraded-network cases rather than a single modern path.
          - Hardware-module post-quantum capability has been confirmed by test within the validated boundary; cloud or managed dependencies have evidenced readiness.
      - number: 5
        name: Optimized
        description: |
          - Capacity headroom and post-quantum performance are monitored as operational properties, with thresholds and alerting; for managed services, this is evidenced through quota, rate-limit, and service-health telemetry rather than direct module instrumentation.
          - Negotiated-mechanism and fallback telemetry is continuous, and silent classical fallback is detected and acted upon.
          - Infrastructure post-quantum readiness, including third-party and managed services, is maintained against change and re-evidenced as components and firmware evolve.
    - id: change-management-and-agility
      weight: 5
      guidance: |
        Change Management and Agility is where a quantum-safe transition is shown to be executable rather than merely intended, and it is the category most central to the extension's purpose. The Governance module establishes which algorithms are approved and who may approve cryptographic change; this category assesses whether the organization can carry an algorithm or certificate-profile change through to production safely, observe it, and reverse it, across the systems that depend on the cryptography, including those it does not directly control.
        Cryptographic agility in the post-quantum context is not the ability to change quickly. It is the ability to change in a controlled, sequenced, and reversible way. The standardization landscape makes this concrete: the signature and key-establishment portfolio is still expanding, with ML-KEM, ML-DSA, and SLH-DSA final, HQC selected as a code-based key-encapsulation backup on a different mathematical basis, and a further lattice signature in standardization; an agile organization must be able to adopt a newly standardized or replacement algorithm without re-architecting. NIST CSWP 39upd1 frames agility as the governing capability for exactly this kind of transition, and the deprecation timeline in NIST IR 8547 makes the transition a sequencing problem rather than a single event.
        The assessable object in this category is a rehearsed change, not a policy. A change that has been staged, measured, and reversed in a representative environment is evidence of agility; a documented intention to be agile is not.

        Operational hazards specific to PQC:
          - Migration is not a single change but a sequenced one. Certificate authority, hardware module, middleware, endpoints, trust stores, monitoring, and external relying parties must change in an order that a dependency map makes explicit; a single undifferentiated roadmap is not a plan.
          - Algorithms may have to be withdrawn under pressure. If a deployed post-quantum algorithm, implementation, or module firmware is weakened, the organization must be able to substitute it without breaking authentication, and this emergency path is distinct from routine change management.
          - Rollback can silently re-enable a deprecated algorithm. A reversion that restores a classical algorithm through configuration drift defeats the migration while appearing to restore service; negative testing for downgrade and drift is therefore part of agility, not separate from it.
          - Hybrid can become permanent debt. A hybrid deployment with no tested exit path to pure post-quantum accumulates size, validation complexity, and downgrade surface indefinitely; agility includes the ability to remove the classical component where the jurisdiction and ecosystem permit.
          - Much of the estate is not under direct control. Third-party software, appliances, and managed services dictate large parts of a migration, and agility must extend to procurement and contractual mechanisms, not only to systems the organization operates.
      assessment: |
        Key Probes:
          - Has the organization executed a representative cryptographic change, including rollback, in an environment resembling production?
          - Is there a dependency map showing the order in which certificate authority, hardware module, middleware, endpoints, trust stores, monitoring, and external relying parties must change?
          - How would the organization respond if a deployed post-quantum algorithm or implementation were weakened, and is that response rehearsed?
          - For systems that cannot migrate on time, who owns the exception, what compensating control applies, and when does it expire?
          - Where hybrid is deployed, is there a defined and tested path to remove the classical component?

        Warning Signs:
          - An assertion of rapid change capability with no record of an exercised change; speed is not agility.
          - A single migration roadmap with no cross-system dependency sequencing.
          - No emergency procedure for an algorithm or firmware withdrawal, only routine change management.
          - Hybrid treated as a finished state with no exit plan.
          - Rollback that re-enables a deprecated classical algorithm through configuration drift.

        Required evidence for the rehearsed cryptographic change (Levels 4 and 5). The demonstration is evidenced by a fixed package: a change record; the dependency map used; the rollout plan and the rollback plan; the telemetry captured during the change; the downgrade-negative test confirming no deprecated classical algorithm was re-enabled; the observed result against the expected result; the exception register; and the residual-risk acceptance. At least one element of the input population is drawn from the governed high-priority exposure set.
      references:
      - nist-cswp-39
      - nist-ir-8547
      - nist-pqc-standardization
      - dutch-pqc-handbook
      levels:
      - number: 1
        name: Initial
        description: |
          - Cryptographic change is handled ad hoc; there is no defined process for substituting an algorithm or certificate profile.
          - No dependency view of which systems consume which cryptography.
          - No emergency procedure for a cryptographic algorithm or implementation being weakened or withdrawn.
          - Agility is assumed rather than tested.
      - number: 2
        name: Foundational
        description: |
          - The need for cryptographic agility is recognized, and a change process exists, but no post-quantum-relevant change has been exercised.
          - Awareness that migration requires sequencing across systems, without a dependency map.
          - Hybrid or post-quantum changes discussed but not staged or tested.
      - number: 3
        name: Advanced
        description: |
          - A defined, owned process exists for cryptographic change, covering algorithm and certificate-profile substitution, with rollback criteria.
          - A dependency map identifies the sequence in which certificate authority, hardware module, middleware, endpoints, trust stores, monitoring, and external relying parties must change.
          - Migration is planned as sequenced waves aligned to the deprecation timeline in NIST IR 8547, not as a single cutover.
          - An emergency cryptographic-change procedure is documented for algorithm or implementation withdrawal.
          - Where hybrid is used, a defined exit path to pure post-quantum is documented; procurement and contractual mechanisms for third-party dependencies are identified.
      - number: 4
        name: Managed
        description: |
          - A representative cryptographic change has been executed end to end in an environment resembling production, including staged rollout, telemetry, and successful rollback, with results retained.
          - The rollback has been verified not to re-enable any deprecated classical algorithm; negative testing for downgrade and configuration drift is part of the exercise.
          - Migration exceptions for systems that cannot move on time are tracked with named owners, compensating controls, and expiry dates.
          - Dependency sequencing has been tested against at least one external relying-party population, and the emergency procedure has been exercised at least once. The demonstrated change includes at least one service or certificate population drawn from the governed high-priority exposure set, so that maturity is not achieved through low-risk systems alone.
      - number: 5
        name: Optimized
        description: |
          - Cryptographic change is a controlled, routinely exercised capability with measured time-to-change and blast radius, integrated into normal change governance rather than run as a special project.
          - The organization can adopt a newly standardized and governance-approved replacement algorithm through its existing process, demonstrated by rehearsal or prior controlled substitution. For algorithms that are selected or in standardization but not yet published and approved for the assessed environment, the expected capability is rehearsal and dependency analysis, not production deployment.
          - Migration exceptions trend toward closure on a tracked schedule, and hybrid deployments have a tested, exercised path to pure post-quantum where the jurisdiction and ecosystem permit.
          - Emergency cryptographic response is proven through periodic exercises, with downgrade resistance continuously monitored, and the evidence base, change records, rollback proofs, exception registers, and exercise reports, is auditable. Migration progress is reported by exposure class, not only by algorithm or migration state, so that coverage of the most exposed assets is visible.
  # Operations (Module 3, Working Draft 0.4). Relevance weights set to each category's
  # post-overlay requirement weight sum, rounded to an integer (30.5 becomes 31); PROVISIONAL.
  - id: O
    categories:
    - id: resilience
      weight: 30
      guidance: |
        Resilience matters to PQC because cryptographic dependencies can become unusable while the PKI service must continue or recover. The central transformation is that successful recovery must restore both service and the applicable approved operational or recovery state. The category does not re-score quantum risk or duplicate the emergency change procedure already assessed in Management.

        Operational hazards specific to PQC:
          - Recovery can restore an obsolete cryptographic configuration. A backup, image, HSM configuration, or service setting can return the service to a pre-migration or otherwise prohibited state even though availability has been restored.
          - The failing dependency may be an algorithm, implementation, module or firmware version, external provider capability, protocol dependency, or configuration. "Backup algorithm" is therefore too narrow a resilience concept.
          - Continuity may legitimately use different paths: another approved mechanism or implementation, another provider, isolation or tunneling, a controlled exception, or deliberate service suspension. The Dutch handbook, UK NCSC, the Canadian roadmap, and ANSSI all treat continuity as preserving service while a cryptographic component is replaced or rolled back; none prescribes zero downtime or a second live PQC algorithm.
          - Incident response and algorithm substitution already exist in the base Resilience model and in the Management module's Change Management and Agility category. Operations Resilience scores the service continuity outcome, not whether the substitution procedure exists.
      assessment: |
        Key Probes:
          - Which material cryptographic dependencies could make a high-priority PKI service unavailable or unable to operate within its approved operational state if they could no longer be used?
          - For each material service, what approved operational or recovery state must be maintained or restored after continuity activation?
          - Can recovery artifacts, backups, module configurations, and service defaults restore the current approved cryptographic state rather than an older one?
          - What continuity or recovery path exists if a material cryptographic dependency is withdrawn, and who is authorized to activate it?
          - Have response and recovery objectives for material cryptographic disruptions been aligned with existing service criticality and continuity objectives rather than assigned a universal PQC-specific time?
          - Can the program produce evidence from a representative cryptographic-disruption exercise showing both the service result and the resulting cryptographic state?

        Warning Signs:
          - Disaster recovery is considered successful once the CA or service is reachable, with no check of the restored cryptographic state.
          - Backups or infrastructure-as-code predate the current cryptographic policy, and no control prevents them from restoring prohibited mechanisms.
          - The continuity plan assumes a "backup PQC algorithm" without identifying common implementation, provider, or hardware dependencies.
          - The emergency algorithm-change procedure is cited as proof of resilience even though service continuity during the exercise was not measured.
          - A universal zero-downtime or fixed-hour target is asserted without reference to the service's existing continuity objectives and risk posture.
      references:
      - nist-cswp-39
      - dutch-pqc-handbook
      - uk-ncsc-pqc-migration
      - cccs-itsm-40-001
      - anssi-crypto-agility
      - g7-cwg-pqc-migration
      levels:
      - number: 1
        name: Initial
        description: |
          - Cryptographic dependency failure is not considered in resilience planning for PQC-relevant services.
          - Recovery procedures verify service availability but do not verify the resulting cryptographic state.
          - Backups, images, or service configurations can restore pre-transition cryptography without a defined detection or acceptance decision.
      - number: 2
        name: Foundational
        description: |
          - The organization recognizes that algorithms, implementations, modules, providers, or protocol dependencies can become unusable during the PQC transition.
          - Some continuity alternatives or recovery concerns have been identified, but the approved post-recovery cryptographic state and evidence requirements are not defined consistently.
          - Business continuity documentation mentions PQC or cryptographic disruption, but representative exercises have not established secure continuity.
      - number: 3
        name: Advanced
        description: |
          - Material cryptographic dependencies are linked to the critical PKI services that depend on them, using the governed risk and dependency information rather than a separate Operations risk model.
          - For each material service class, continuity and recovery procedures define the approved post-recovery cryptographic state, activation authority, dependencies, fallback or service-suspension conditions, and applicable response/recovery objectives.
          - Recovery procedures define how relevant backups, images, configurations, and recovery artifacts are checked and controlled so that restoration does not unknowingly reintroduce cryptography outside the approved recovery state.
          - A representative cryptographic-disruption exercise is defined, including how the service outcome and cryptographic post-condition will be evidenced.
      - number: 4
        name: Managed
        description: |
          - A representative cryptographic-disruption scenario has been exercised in a production-like environment against a representative subset of the governed high-priority exposure set. The scenario assumes that a material cryptographic dependency can no longer be used.
          - The organization demonstrates either continued service, controlled interruption, or recovery within its applicable continuity objectives, and separately verifies that the resulting cryptographic state matches the approved recovery state.
          - The retained evidence records the selected scenario, affected service and dependency, expected continuity and cryptographic outcomes, execution result, timing against existing objectives, exceptions, findings, remediation, and retest status.
          - A recovery that restores service while restoring prohibited or unapproved cryptography is treated as a failed demonstration, not a successful disaster-recovery result.
      - number: 5
        name: Optimized
        description: |
          - Cryptographic-disruption resilience is part of normal continuity practice rather than a one-time PQC exercise.
          - Continuity and recovery paths are re-evidenced after material dependency, architecture, provider, or cryptographic-policy changes, or on a justified cadence where such change is infrequent.
          - Actual exercise or incident performance is measured against the existing service continuity objectives, and lessons are fed into normal resilience improvement.
          - The viability of recovery artifacts and approved alternative states is maintained. The post-recovery cryptographic state is verified against the approved recovery state before recovery is closed; any deviation enters the established exception or incident path. Monitoring evidence may be reused where it supports that verification.
    - id: automation
      weight: 5
      guidance: |
        The base PKIMM Automation category is explicitly about certificate lifecycle automation. This extension keeps that boundary. PQC increases the value and scale of controlled automation, but it does not make automation an end in itself. Deliberate manual operation of offline or high-assurance processes can be fully appropriate.
        Automated cryptographic inventory discovery and CI/CD cryptographic validation are useful PQC practices, but they are not scored here merely because they are automated. Discovery belongs to cryptographic visibility, inventory, and monitoring; CI/CD cryptographic validation is an enabling development/change-management practice. The Automation category scores automated certificate lifecycle processes.

        Operational hazards specific to PQC:
          - Automated issuance, renewal, replacement, or deployment tooling may not understand the required PQC or transitional certificate profile, algorithm identifier, key type, object size, or target population.
          - An automated process can propagate a wrong certificate or configuration quickly across a large population. The risk is controlled through bounded scope, expected outcomes, guardrails, and exception handling rather than by maximizing automation.
          - A workflow can complete while producing an incorrect certificate outcome. The automation therefore needs a validated outcome, not merely a successful job status.
          - Live protocol fallback after a correctly completed certificate operation is assessed under Monitoring and Auditing, not scored again as Automation failure.
      assessment: |
        Key Probes:
          - Which certificate lifecycle processes are automated, and which are deliberately manual because automation is not appropriate?
          - For each automated PQC-relevant process, what certificate profile, key/signature configuration, target population, prerequisites, and expected outcome are defined?
          - What prevents an automated job from propagating an incorrect or unsupported PQC profile across the full population?
          - How are incorrect outcomes, failures, and exceptions detected, contained or otherwise handled according to the defined controls, recorded, and routed for manual action?
          - Has a representative PQC certificate lifecycle operation been demonstrated, including an incorrect or failed case?
          - When profiles, standards, or vendor capabilities change, how is the automation reassessed before broad rollout?

        Warning Signs:
          - "Level 5 means full automation" or a target automation percentage with no risk rationale.
          - An automated renewal report is treated as proof of the intended certificate state without checking the issued artifact and target assignment.
          - High-assurance manual ceremonies are treated as immature merely because they remain manual.
          - PQC inventory scanners or CI/CD security tests are claimed as evidence for certificate-lifecycle automation without an automated certificate process in scope.
          - No defined stop, exception, or manual path exists when a new PQC profile fails on part of the population.
      references:
      - nist-cswp-39
      - dutch-pqc-handbook
      - omb-m-26-15
      levels:
      - number: 1
        name: Initial
        description: |
          - Certificate lifecycle automation, where present, has no deliberate handling of PQC or transitional certificate profiles.
          - The organization does not know whether its automated certificate tooling can issue, renew, replace, deploy, or retire the required PQC-relevant artifacts.
          - No distinction is made between processes that should be automated and high-assurance processes that should remain deliberately manual.
      - number: 2
        name: Foundational
        description: |
          - Initial testing or vendor review indicates that some automated certificate workflows may support the required PQC or transitional profiles.
          - Expected outcomes, guardrails, and exception behavior are incomplete or depend on manual troubleshooting.
          - The organization recognizes that some high-assurance processes may remain manual but has not documented the automation applicability decision consistently.
      - number: 3
        name: Advanced
        description: |
          - For each material certificate lifecycle process, the organization records whether automation is appropriate and why; deliberate manual high-assurance paths are explicitly identified.
          - Automated PQC-relevant processes define supported certificate profiles and cryptographic configuration, prerequisites, target population, expected output, logging/monitoring, guardrails, exception paths, and human decision points.
          - The automated process validates the certificate or deployment outcome within the part of the lifecycle it controls, for example profile, algorithm/signature configuration, target assignment, and, where applicable, chain or trust configuration, rather than relying only on workflow completion.
          - Changes to PQC profiles, relevant standards, or provider capability trigger review of the affected automation before broad deployment.
      - number: 4
        name: Managed
        description: |
          - A representative set of automated PQC certificate lifecycle operations covering the material automation patterns or classes has been demonstrated in a production-like environment, with any exclusions justified.
          - The demonstration includes a real or deliberately induced incorrect or failed outcome and shows that the condition is detected, the failure impact is contained or otherwise handled according to the defined controls, and the exception or incident path is followed.
          - Retained evidence records the automation configuration, target population, expected certificate/cryptographic outcome, observed result, monitoring evidence, exception handling, remediation, and retest status.
          - The level does not require automation of processes for which the scoped assessment shows deliberate manual operation is the appropriate control.
      - number: 5
        name: Optimized
        description: |
          - PQC certificate lifecycle automation is routine and controlled where automation is appropriate, with outcomes and exceptions reviewed as part of normal operation.
          - Guardrails and target populations are maintained as profiles, standards, providers, and supported client populations change.
          - Failure and exception paths are periodically proven or re-evidenced after material change, and recurring exceptions drive process or migration improvement.
          - Automation remains deliberately bounded: the highest maturity level does not remove human approval or manual operation where those controls are required for assurance.
    - id: interoperability
      weight: 10
      guidance: |
        PQC turns interoperability into a time-varying coexistence problem. Classical, hybrid, and PQC mechanisms can coexist while standards, implementations, external parties, and network paths change independently. The goal is not maximum compatibility forever; it is secure interoperability through transition, followed by controlled retirement of compatibility paths that are no longer needed.

        Operational hazards specific to PQC:
          - Endpoint capability does not prove path compatibility. New groups, larger handshake messages, proxies, load balancers, DPI systems, trust stores, and relying-party stacks can break an otherwise correct deployment: the G7 statement and UK NCSC call for testing assembled systems, AWS documents testing hybrid TLS across network paths, and Cloudflare had to roll back a standards-correct origin-authentication change because of ecosystem incompatibility.
          - Different cryptographic roles can migrate at different speeds. Key establishment, authentication/signature, certificate format, and protocol support must not be collapsed into a single "PQC supported" state.
          - Pre-standard and final algorithm or protocol identifiers can be incompatible. RFC 9935, for example, states that standardized ML-KEM and pre-standard Kyber are not compatible, and RFC 10024 obsoletes the pre-standard hybrid TLS 1.3 groups in favor of the standards-track code points.
          - Temporary classical compatibility may be needed during migration, but indefinite support increases downgrade surface and legacy debt. The transition state therefore needs an exit condition: the Dutch handbook and UK NCSC both call for defined criteria to end traditional support, and the exit condition is tied to the applicable regulatory, contractual and risk-based deprecation horizon. NIST IR 8547 is one such reference: it deprecates quantum-vulnerable public-key algorithms after 2030 and disallows them after 2035.
          - A successful initial interoperability test can become stale after a library, provider, certificate profile, protocol specification, network intermediary, or relying-party population changes.
      assessment: |
        Key Probes:
          - What supported transition states are documented for the material integrations in scope, separated by cryptographic role where relevant, and which approved direction, transition rule, or exception permits each state?
          - Which material protocols, runtimes, client classes, providers, certificate profiles, network paths, and external relying parties form the representative interoperability population?
          - Does the integration record the exact relevant scheme, parameter set or identifier, applicable standard or vendor specification, version and status where relevant, implementation version, and compatibility assumptions?
          - Which classical or transitional compatibility paths are temporarily permitted, for which populations, under what controls, and with what exit condition?
          - Which material changes trigger interoperability re-evaluation rather than waiting for a fixed annual test?
          - Can the program show that an established material integration was revalidated after a meaningful change, including defects and remediation?

        Warning Signs:
          - Vendor A supports PQC and Vendor B supports PQC; therefore, the combined solution is assumed to interoperate.
          - "TLS 1.3" or "PQC certificate" is recorded without exact scheme/profile/version information where those details affect compatibility.
          - Only pristine modern endpoints are tested while proxies, legacy classes, external relying parties, or constrained paths remain untested and unexplained.
          - Classical compatibility remains enabled indefinitely because it avoids breakage, with no exit condition.
          - Interop was demonstrated once during migration and is never revalidated after implementation or ecosystem changes.
      references:
      - g7-cwg-pqc-migration
      - uk-ncsc-pqc-migration
      - dutch-pqc-handbook
      - nist-ir-8547
      - rfc-9954
      - rfc-10024
      - rfc-9881
      - rfc-9935
      - nist-sp-1800-38
      levels:
      - number: 1
        name: Initial
        description: |
          - PQC interoperability is inferred from component or vendor capability rather than demonstrated across the material environment.
          - The organization does not distinguish key establishment, authentication, certificate/profile, and compatibility states where those roles differ.
          - External relying parties, network intermediaries, protocol versions, and legacy populations are not systematically considered.
      - number: 2
        name: Foundational
        description: |
          - Major PQC interoperability risks and external dependencies are recognized, and some component or end-to-end tests have been performed.
          - Classical, hybrid, and PQC coexistence is understood as temporary, but permitted transition states, exact specifications, and exit conditions are incomplete.
          - Testing remains ad hoc and is not tied to a defined representative interoperability population or change triggers.
      - number: 3
        name: Advanced
        description: |
          - Supported transition states are documented for material integrations as operational representations of states already permitted by the organization's approved cryptographic direction, transition rules, or documented exceptions; cryptographic roles are separated where needed.
          - A representative interoperability population is maintained from the dependency map and includes the material protocols, runtimes, providers, certificate profiles, client or relying-party classes, and network paths that could block migration.
          - Integration records identify exact relevant schemes, parameters or identifiers, applicable standard or vendor specification, version and status where relevant, implementation versions, and known compatibility assumptions or limitations.
          - Temporary compatibility paths have owners, scope, controls, and explicit exit conditions; interoperability strategy does not equate maturity with indefinite support for every legacy mechanism.
          - Material change types that trigger interoperability re-evaluation are defined, for example, significant library/provider, profile, protocol, network-path, or relying-party changes.
      - number: 4
        name: Managed
        description: |
          - For a representative subset of the governed high-priority exposure set, a previously established material integration has been revalidated after a meaningful change, or an equivalent representative change has been deliberately simulated in a production-like environment.
          - The evidence covers the relevant end-to-end path rather than only nominal endpoints and includes at least one material compatibility challenge appropriate to the service, such as a legacy class, cross-vendor path, network intermediary, external relying party, or standards/profile transition.
          - Retained evidence records the supported transition state, change/retest trigger, versions/configuration, expected compatibility, observed result, defects, exceptions, remediation owner, and retest status.
          - A compatibility path that works only by silently falling back outside the supported transition state is recorded as an interoperability failure or controlled exception, not a successful test.
      - number: 5
        name: Optimized
        description: |
          - Interoperability continuity is part of routine operation: material changes trigger proportionate revalidation and results are retained as operational evidence.
          - Compatibility exceptions and classical transition paths are reviewed against their exit conditions and are retired when no longer required. After a path is retired, the affected material interoperability population is revalidated and remains within the supported transition state; monitoring evidence may be reused where it supports that conclusion.
          - The representative interoperability population is updated as new material client, provider, protocol, or relying-party classes appear.
          - Recurring defects, fragile paths, and external dependency failures feed back into architecture, supplier requirements, and transition planning rather than being managed indefinitely as local exceptions.
    - id: monitoring-and-auditing
      weight: 31
      guidance: |
        Monitoring and Auditing is the operational feedback layer of the PQC transition. The central problem is that service success does not necessarily prove cryptographic success. A connection, certificate operation, or recovered service can function while using a mechanism outside its approved operational state. The organization therefore needs enough operational evidence to establish what cryptography is actually in use for material services and to detect material deviation from the intended state.

        Operational hazards specific to PQC:
          - A binary "PQC enabled" indicator can be misleading. Key establishment, authentication/signature, certificate chain/profile, and fallback state may be at different migration stages.
          - Silent or unauthorized classical fallback can preserve availability while defeating the intended PQC protection. UK NCSC guidance explicitly warns that incorrect cryptographic configuration may not cause service failure and recommends verifying actual use; its October 2026 TLS guidance names the recommended hybrid and pure post-quantum configurations against which actual use can be checked.
          - The observed live state can drift from inventories, approved configurations, or migration records because of rollback, restore, provider change, library update, or configuration regression.
          - Temporary fallback may be legitimate when controlled. The failure is unexpected, invisible, unexplained, or unbounded fallback, not every classical connection.
          - Long-retained audit evidence may itself depend on quantum-vulnerable asymmetric mechanisms for integrity or provenance. This is a derived assessment concern from the base PKIMM requirement to preserve audit evidence integrity and the broader requirement to manage outgoing cryptographic mechanisms, not a prescribed preservation mechanism. Where such a dependency exists, it must be identified, but this module does not prescribe a universal re-signing or timestamping scheme.
          - Monitoring cannot detect a remote passive harvest-now-decrypt-later adversary. The module monitors exposure and operational cryptographic state, not the adversary's off-path collection activity.
      assessment: |
        Key Probes:
          - For each material service class, which cryptographic roles must be observable to establish the layered operational cryptographic state?
          - Which telemetry, logs, provider records, configuration evidence, inventory data, or protocol observations establish that state, and what known visibility gaps remain?
          - How is observed state compared with the supported transition state, approved operational state, migration state, and approved exception population?
          - Can the organization distinguish expected controlled fallback from unexpected or unauthorized fallback?
          - Can monitoring detect a previously migrated service returning to prohibited cryptography, an unexpected or unknown mechanism/profile appearing within the monitored scope where that state is materially observable, or required PQC telemetry disappearing?
          - Can historical evidence reconstruct the material cryptographic state relevant to an incident or period without requiring indefinite retention of every handshake?
          - Where long-retained audit evidence relies on asymmetric cryptography for integrity or provenance, is that dependency identified and treated according to its retention need?

        Warning Signs:
          - A service-health dashboard is treated as proof that PQC is operating.
          - A single "PQC yes/no" field hides the fact that key establishment has migrated while authentication remains classical.
          - Fallback is allowed for compatibility, but no one can identify which population is using it or when it should end.
          - Monitoring relies only on configured policy and cannot show the mechanism actually negotiated or used where such evidence is materially available.
          - The organization claims to detect harvest-now-decrypt-later attackers rather than monitoring the cryptographic exposure they could exploit.
          - Level 5 is interpreted as retaining every cryptographic event forever or fully automating all discovery.
      references:
      - uk-ncsc-pqc-migration
      - uk-ncsc-tls-guidance
      - nist-cswp-39
      - dutch-pqc-handbook
      - g7-cwg-pqc-migration
      levels:
      - number: 1
        name: Initial
        description: |
          - The organization cannot reliably determine whether material services are actually using the intended PQC, hybrid, or classical cryptographic mechanisms.
          - Successful service operation is treated as sufficient evidence of cryptographic success.
          - Fallback, cryptographic drift, and regression are not distinguished operationally.
      - number: 2
        name: Foundational
        description: |
          - Some PQC-related logs, metrics, provider records, or manual checks exist for selected systems, but coverage and interpretation are incomplete.
          - The organization can identify some classical versus PQC use, but layered roles, expected exceptions, and state correlation are inconsistent.
          - Fallback or cryptographic drift may be discovered during troubleshooting but is not systematically classified against an approved operational state.
      - number: 3
        name: Advanced
        description: |
          - For material services, the layered operational cryptographic state that must be observable is defined, including the relevant cryptographic roles, expected transition state, and controlled fallback conditions.
          - Telemetry and evidence sources are mapped to the material service population, with known visibility gaps, retention needs, interpretation rules, and correlation to inventory, migration state, and approved exceptions documented.
          - Operational conditions requiring detection are defined, including unexpected classical fallback, prohibited/deprecated algorithm use, cryptographic regression, unexplained state/inventory drift, appearance of unexpected or unknown profiles or mechanisms within the monitored scope where materially observable, and loss of required PQC telemetry where applicable.
          - Audit requirements define sufficient historical reconstructability of material cryptographic state without prescribing one universal per-connection retention architecture.
          - Where long-retained audit evidence depends on quantum-vulnerable asymmetric cryptography for integrity or provenance, that dependency is identified and assigned an appropriate treatment. This is a conditional derived concern from the base audit-integrity requirement and broader cryptographic-transition obligations; the module does not prescribe a universal preservation mechanism.
      - number: 4
        name: Managed
        description: |
          - Against a representative subset of the governed high-priority exposure set, the organization has demonstrated in a production-like environment or can produce retained evidence from an equivalent prior event that a material deviation from the expected cryptographic state within the defined monitoring coverage is observable and correctly classified. The demonstrated state itself must be observable; other known material visibility gaps are documented, justified, and treated.
          - The demonstration includes an expected state, an induced or previously observed deviation such as unauthorized fallback or prohibited configuration, the relevant telemetry or evidence, correlation to the affected population, detection/classification, responsible handling, remediation or exception outcome, and retest status.
          - The organization can reconstruct the material historical cryptographic state needed to investigate the demonstrated event or an equivalent incident.
          - Evidence from Management-module migration or downgrade tests may be reused where it proves these Operations claims; reuse does not automatically satisfy the criterion.
      - number: 5
        name: Optimized
        description: |
          - Cryptographic state is an operationally controlled property for the material service population rather than assumed from configuration. For material states that can change dynamically during normal operation, observation is ongoing at a frequency and coverage sufficient to detect material deviation. For static, offline, or event-driven states, periodic attestation or evidence generated on relevant events may provide equivalent assurance; the chosen method and coverage are justified by architecture and risk.
          - Unexpected cryptographic regression, prohibited use, or unexplained fallback within the monitored scope is detected and acted upon through normal operational response paths.
          - Fallback and compatibility exception populations are measured against their approved scope and exit conditions, and retirement is verified when those paths are removed.
          - Operational coverage and known visibility gaps are reported by relevant exposure or service class, and material telemetry gaps trigger remediation rather than silent loss of assurance.
          - Audit and monitoring evidence remains sufficient for required investigation and assurance purposes, while retention and granularity are proportionate to risk rather than universally maximized.
overlays:
  # OVERLAY STACKING (design note, addresses community feedback on Q5):
  # Overlays are applied per requirement. Where more than one overlay
  # affects a requirement's effective weight, multiplier-type overlays
  # compound multiplicatively rather than additively. This is intended:
  # a requirement that is important on two independent grounds should be
  # emphasized more than one important on a single ground. Effective and
  # base weights are both shown in-tool so the effect is transparent.
  # Addition- and override-type overlays do not compound; an override
  # replaces the base weight, and an addition adjusts it once.
  modules:
  - id: G
    categories:
    - id: strategy-and-vision
      requirements:
      - id: sponsor-support
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC requires active multi-year executive commitment, cascading sponsorship, quantum risk in ERM. These are new demands absent in classical PKI.
      - id: responsible-leadership
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC requires entirely new roles (migration lead, crypto-agility coordinator, steering committee) not present in classical PKI.
      - id: scope-and-drivers
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC introduces new business drivers (HNDL threat, Mosca inequality, regulatory timelines) absent in classical PKI.
      - id: architecture
        type: multiplier
        multiplier: 2.5
        rationale: |
          Extreme outlier. Base weight 1 (floor) yet hybrid vs pure PQ, algorithm selection, HSM compatibility are among the most consequential PQC decisions. Largest gap between base weight and PQC importance in Module 1.
    - id: policies-and-documentation
      requirements:
      - id: policy-scope
        type: multiplier
        multiplier: 1.5
        rationale: |
          Policy scope expands (multi-jurisdiction, PQC obligations) but the core activity remains 'define and document policy scope'.
      - id: certificate-policy
        type: multiplier
        multiplier: 1.5
        rationale: |
          CP requires fundamental rewrite for PQC: algorithm specifications, deprecation schedules, hybrid requirements, CBOM. Weight is max but PQC transforms what CP must contain.
      - id: practice-statement
        type: multiplier
        multiplier: 1.5
        rationale: |
          CPS requires new operational procedures for PQC: key ceremony scripts, HSM initialization, stateful HBS management. Weight is max but content changes fundamentally.
      - id: disclosure-statement
        type: multiplier
        multiplier: 1.5
        rationale: |
          Disclosure scope expands (relying parties need quantum readiness posture) but core activity remains 'publish disclosure.' Weight 4 already substantial.
      - id: policy-review
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC demands fundamentally new review discipline: quarterly algorithm governance with formal add/deprecate procedures. This is a new governance process, not faster review.
    - id: compliance
      requirements:
      - id: compliance-policies
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC introduces entirely new compliance domain: DORA quantum requirements, CNSA 2.0, eIDAS 2.0 crypto requirements. New obligations, not expanded existing ones.
      - id: compliance-monitoring
        type: multiplier
        multiplier: 1.5
        rationale: |
          Monitoring scope expands (PQC audit criteria, CBOM verification) but core activity remains 'operate compliance monitoring program'.
      - id: compliance-responsibilities
        type: multiplier
        multiplier: 1.5
        rationale: |
          Existing compliance roles expand to cover PQC obligations. New interfaces needed but responsibility assignment is the same core activity.
      - id: regulatory-inventory
        type: multiplier
        multiplier: 1.0
        rationale: |
          EXPLICITLY assigned 1.0x in v1.3 Section 7.1: 'Already highest weight.' PQC adds entries to the list but the activity of maintaining the list is unchanged. Framework confirms.
    - id: processes-and-procedures
      requirements:
      - id: process-scope
        type: multiplier
        multiplier: 1.5
        rationale: |
          Process scope expands to cover PQC activities but the core activity remains 'align process scope with policy scope'.
      - id: process-documentation
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC introduces fundamentally new processes: hybrid key ceremonies, Mosca analysis, crypto-agility with substitution/rollback. New processes, not expanded documentation.
      - id: bau-execution
        type: multiplier
        multiplier: 1.0
        rationale: |
          Timely execution remains 'execute recurring activities on time.' PQC adds urgency (ANSSI 2027, CNSA 2.0) but the nature of timely execution is unchanged. Weight at max.
      - id: process-evidence
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC introduces entirely new evidence categories: PQC key ceremony records, algorithm substitution drill results, CBOM artifacts, time-to-transition metrics. New evidence discipline.
      - id: process-improvement
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC demands fundamentally different review cadence. Evolving standards require near-continuous updates, not periodic review.
    - id: cryptography
      requirements:
      - id: crypto-terminology
        type: multiplier
        multiplier: 1.0
        rationale: |
          PQC brings new terms that must be defined consistently, but defining terms is not a new capability. The requirement stays at neutral weight; consistent PQC terminology appears as a supporting criterion within the levels.
      - id: crypto-algorithms
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC substantially expands what algorithm governance has to cover: new standards and parameter sets, a decision status for each algorithm, separate choices for key establishment and signatures, and authority positions that differ by jurisdiction. The extra weight reflects that expansion.
      - id: crypto-protocols
        type: multiplier
        multiplier: 1.5
        rationale: |
          PQC adds new, checkable content to protocol governance: hybrid combinations, permitted fallbacks to classical cryptography, limits on downgrades, a period where old and new cryptography run side by side, and formally approved exceptions. That is new governed content with its own evidence, which is why protocols carries weight where terminology does not.
      - id: crypto-visibility
        type: multiplier
        multiplier: 2.5
        rationale: |
          Visibility feeds everything else: prioritization, impact analysis, dependency management, and knowing when the transition is actually done. Because weak visibility limits what the algorithm, lifecycle, and agility requirements can achieve, this requirement carries the highest PQC multiplier in the extension.
      - id: crypto-lifecycle
        type: multiplier
        multiplier: 1.5
        rationale: |
          PQC brings long-horizon deadlines from multiple authorities, and they differ in force. Lifecycle governance must tell binding, advisory, and draft timelines apart and set internal dates the organization can justify.
      - id: crypto-agility
        type: multiplier
        multiplier: 2.0
        rationale: |
          A core capability of the transition. NIST CSWP 39upd1 surveys the strategies, practices, and trade-offs; the weight reflects the need for algorithm change to be a repeatable, evidenced governance process rather than a one-off effort.
  # Management overlays. The Module 2 document fixes strengths, not values; multipliers
  # follow the Operations convention: Moderate 1.5, Strong 2.0, Headline 2.5. PROVISIONAL.
  - id: M
    categories:
    - id: key-management
      requirements:
      - id: key-lifecycle
        type: multiplier
        multiplier: 2.0
        rationale: |
          Post-quantum migration introduces new key formats, seed handling, module-capability dependence, and, where stateful hash-based signing is in scope, a state-management failure mode that is catastrophic and unrecoverable. The lifecycle requirement is transformed in nature, not merely made more urgent.
      - id: key-inventory
        type: multiplier
        multiplier: 1.5
        rationale: |
          The inventory becomes the migration-driving record: per-key algorithm, parameter set, module location, exportability, and migration state, reconciled with the discovery effort. Materially expanded content on an existing mechanism.
    - id: certificate-management
      requirements:
      - id: cert-lifecycle
        type: multiplier
        multiplier: 2.0
        rationale: |
          Validity-versus-algorithm-lifetime, relying-party validation, and trust-anchor transition transform the lifecycle requirement under post-quantum conditions.
      - id: cert-inventory
        type: multiplier
        multiplier: 1.5
        rationale: |
          Post-quantum migration turns the inventory into a migration control: algorithm and migration state must be tracked to support revocation and reissuance planning.
      - id: cert-discovery
        type: multiplier
        multiplier: 2.0
        rationale: |
          Discovery linked to dependency mapping is the entry condition for migration scoping; its post-quantum role is materially larger than its base weight reflects.
    - id: infrastructure-management
      requirements:
      - id: infra-documentation
        type: multiplier
        multiplier: 2.0
        rationale: |
          Hardware-module firmware and validation readiness, and capacity for larger objects, transform this requirement and frequently gate migration.
    - id: change-management-and-agility
      requirements:
      - id: agility-requirements
        type: multiplier
        multiplier: 2.5
        rationale: |
          Agility is the spine of the extension yet carries a low base weight; this is the largest gap between base weight and post-quantum importance in the module. A new control that must be continuously evidenced and that can block rollout even when policy is correct.
      - id: change-process
        type: multiplier
        multiplier: 1.5
        rationale: |
          Algorithm substitution, rollback, and downgrade-negative testing introduce process content specific to the migration.
  - id: O
    categories:
    - id: resilience
      requirements:
      - id: business-continuity
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC changes the definition of successful recovery. Availability can be restored while the cryptographic state regresses to a prohibited configuration or otherwise falls outside the approved recovery state, so recovery must prove both service outcome and cryptographic post-condition.
    - id: interoperability
      requirements:
      - id: interop-strategy
        type: multiplier
        multiplier: 2.0
        rationale: |
          PQC changes interoperability from a largely static compatibility objective into a security-sensitive coexistence-and-retirement problem. Temporary classical compatibility can be operationally necessary while also creating downgrade exposure, and the strategy must keep the material ecosystem working as standards and implementations change.
    - id: monitoring-and-auditing
      requirements:
      - id: event-monitoring
        type: multiplier
        multiplier: 2.5
        rationale: |
          PQC creates a distinct operational failure mode in which the service continues to operate successfully while the cryptographic protection has silently regressed or fallen outside the approved transition state. Monitoring must therefore observe cryptographic state itself rather than infer it from service health.
